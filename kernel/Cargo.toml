[package]
name = "mnemosyne-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mnemosyne-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
mnemosyne-abi = { path = "../crates/abi" }
linked_list_allocator = { version = "=0.10.6", default-features = false, features = ["use_spin"] }
mnemosyne-capability = { path = "../crates/capability" }
limine = "=0.5.0"
pic8259 = { version = "=0.11.0", default-features = false, features = ["stable"] }
spin = { version = "=0.12.3", default-features = false, features = ["mutex", "spin_mutex", "lazylock", "once"] }
uart_16550 = "=0.8.1"
x86_64 = { version = "=0.15.4", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
