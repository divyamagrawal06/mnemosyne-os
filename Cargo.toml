[workspace]
resolver = "2"
members = ["kernel", "crates/capability", "host/replay-lab", "crates/service-runtime", "crates/chronicle-fs", "crates/recovery-policy", "crates/abi"]
default-members = ["crates/capability", "host/replay-lab", "crates/service-runtime", "crates/chronicle-fs", "crates/recovery-policy", "crates/abi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
