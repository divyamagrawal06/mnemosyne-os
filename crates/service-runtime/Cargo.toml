[package]
name = "mnemosyne-service-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wasmi = { version = "=2.0.0", default-features = false, features = ["stable", "libm", "validate", "deterministic", "portable-dispatch", "extra-checks", "prefer-btree-collections"] }
sha2 = { version = "=0.10.9", default-features = false }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "alloc"] }

[build-dependencies]
wat = { version = "=1.228.0", default-features = false }

[dev-dependencies]
wat = { version = "=1.228.0", default-features = false }

